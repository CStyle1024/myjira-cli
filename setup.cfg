[metadata]
name = myjira-cli
version = 0.1.0
description = Standalone Jira command line tool

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    PyYAML>=6,<7

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    myjira-cli = myjira_cli.cli:main
